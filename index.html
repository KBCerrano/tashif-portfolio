    <!-- Fonts: preconnect first so the font request starts without waiting on CSS.
       Clash Grotesk (Fontshare) carries both headings and body — one family. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=clash-grotesk@400,500,600,700&display=swap"
    />
    <!-- Clash Display 700 is used only for the hero name. Fontshare drops the
       second family when two are combined in one request, so it needs its own link. -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@700&display=swap"
    />
