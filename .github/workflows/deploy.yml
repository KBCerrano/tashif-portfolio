# Builds the site and publishes it to the gh-pages branch, which is what
# GitHub Pages serves at www.tashifkhan.ca.
#
# Deploys used to be a manual step, so main and the live site drifted apart.
name: Build and deploy

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: write

# A second push while one deploy is mid-flight would race it to gh-pages.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # public/CNAME has to survive into dist or the custom domain stops
      # resolving the moment this branch is published.
      - name: Check the custom domain file is in the build
        run: |
          test -f dist/CNAME || {
            echo "dist/CNAME is missing - refusing to deploy, this would break www.tashifkhan.ca"
            exit 1
          }
          echo "CNAME: $(cat dist/CNAME)"

      # gh-pages holds build output only, so each deploy replaces it with a
      # single commit rather than accumulating history for generated files.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
